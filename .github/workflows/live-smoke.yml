name: Live smoke

# Runs the smoke suites against a throwaway Flashlight shop, one job per
# PrestaShop version. Both suites run in every job, and a red in either one
# fails the job.
#
# Every row is expected to be GREEN. That was not true when this workflow
# landed: BackOfficeSmoke was red everywhere on the version cross-check and
# additionally red on 1.7 and 8.2 for the login-error read and logout. Those
# three were page-object defects, not absences of support, and they are fixed —
# see the commit that touched src/Pages/BackOfficePage.php. A red row is now a
# regression and should be read as one.
#
# `fail-fast: false` still keeps one red row from cancelling the others: the
# point of the matrix is to say WHICH versions diverged, not merely that one
# did. Nothing here is `continue-on-error`.
#
# Measured 2026-09-24 against Flashlight, 7 runs per combination:
#
#   FrontOfficeSmoke  7/7 green on 1.7.8.11, 8.2.8 and 9.2.0, classic and
#                     hummingbird.
#   BackOfficeSmoke   7/7 green on the same four combinations. The bad-password
#                     step, which used to land both ways on 1.7 and 8.2, was
#                     green in all 28 runs.
#
# Those 7/7 hid a flake: from 2026-09-28 "create the account" failed now and
# then on 9.2.0 hummingbird only (runs 36429401318, 36553975925, 36555659821).
# The password strength feedback appeared asynchronously and moved the submit
# button under the mouse click; Registration::register() now waits for it.
# Measured 2026-09-29 on PR #77, runs 36564596092 (10 attempts) and
# 36567081351, both suites per job:
#
#   9.2.0 hummingbird  11/11 green (1 initial run, 7 job-only reruns,
#                      2 full-matrix reruns, 1 run on the next commit).
#   9.2.0 classic, 8.2.8 classic, 1.7.8.11 classic  4/4 green each.

# Matrix scope. Full matrix on push to main, on workflow_dispatch, on pull
# requests into main (the dev -> main release PRs, whose checks are the
# required ones on main) and on any pull request labelled `ci:full` (use it
# when a change touches a 1.7 / 8 page object or a Classic-only selector).
# Every other pull request (the day-to-day ones into dev) runs only what is
# listed as "PR" below, to save Actions minutes.
#
# PR: 9.2.0 hummingbird only, the theme closest to what testers run.
# Full: the four rows below.

on:
  push:
    branches: [main]
  # `labeled` lets the `ci:full` label start a full-matrix run on an open pull
  # request; any other label is ignored by the job-level `if` below (a skipped
  # job costs no minute).
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Runs the smoke AND the scenario suites on demand, whatever changed.
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke (PrestaShop ${{ matrix.ps }}, ${{ matrix.theme }})
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The 9.2.0 hummingbird row always runs; the three others only in the
        # full matrix. A `fromJSON` expression rather than a setup job: no
        # extra job (and no extra billed minute) on every run. An `exclude`
        # cannot do it, `include` is applied after it and would add the rows
        # back.
        #   - 9.2.0 classic is shop 2 of the ps92 container, on its own port
        #     and its own theme. Without it "9.2 passes" would only ever mean
        #     "hummingbird passes", and a theme-aware selector that silently
        #     matched on one theme would never be caught. The scenarios write
        #     back-office settings (checkout layout, theme) per shop: this
        #     row's are shop 2's.
        include: >-
          ${{ fromJSON(format('[{0}{1}]',
          '{"ps": "9.2.0", "service": "ps92", "port": 8092, "theme": "hummingbird", "shop_id": 1}',
          (github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'ci:full'))
          && ', {"ps": "1.7.8.11", "service": "ps17", "port": 8017, "theme": "classic", "shop_id": 1}
          , {"ps": "8.2.8", "service": "ps82", "port": 8082, "theme": "classic", "shop_id": 1}
          , {"ps": "9.2.0", "service": "ps92", "port": 8093, "theme": "classic", "shop_id": 2}'
          || ''
          )) }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The scenario step compares the PR with its base branch.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-8.3-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.3-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Start the shop
        run: docker compose up ${{ matrix.service }} -d

      # Probe /admin-dev/, not /. The front office answers 200 well before the
      # post-scripts that provision the second shop have finished, so polling /
      # would let the suite start against a half-provisioned shop. Flashlight
      # redirects /admin-dev/ to the login page (302) once the container is
      # really serving.
      - name: Wait for the shop
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${{ matrix.port }}/admin-dev/" || true)
            if [ "$code" = "302" ] || [ "$code" = "200" ]; then
              echo "back office answers $code — shop is up"; exit 0
            fi
            echo "back office answers ${code:-000}, waiting..."
            sleep 5
          done
          echo "shop never came up"; docker compose logs ${{ matrix.service }}; exit 1

      # Both suites run even when the first one is red, so one job reports the
      # whole inventory rather than stopping at the front office. Each command's
      # status is captured separately and the step exits non-zero if either
      # failed, so neither suite can hide the other's result.
      - name: Run the smoke suites
        env:
          PRESTAFLOW_FO_URL: http://localhost:${{ matrix.port }}/
          PRESTAFLOW_BO_URL: http://localhost:${{ matrix.port }}/admin-dev/
          PRESTAFLOW_BO_EMAIL: admin@prestashop.com
          PRESTAFLOW_BO_PASSWD: prestashop
          PRESTAFLOW_PS_VERSION: ${{ matrix.ps }}
          PRESTAFLOW_THEME: ${{ matrix.theme }}
          PRESTAFLOW_LOCALE: en
        # Every `prestaflow run` empties prestaflow/ when it starts, so the back
        # office run used to delete the front office's error screenshots before
        # the upload could see them — which is why red rows printed a PNG path
        # and still uploaded nothing. Each suite's output is copied aside as
        # soon as it finishes.
        run: |
          status=0
          for suite in FrontOfficeSmoke BackOfficeSmoke; do
            php bin/prestaflow run "src/Tests/Suites/Smoke/$suite.php" || status=1
            if [ -d prestaflow ]; then
              mkdir -p "smoke-output/$suite"
              cp -R prestaflow/. "smoke-output/$suite/"
            fi
          done
          exit $status

      # The scenario suites (src/Tests/Suites/Scenarios) on the shop this job
      # already started: no extra job, no extra shop boot. They cost several
      # minutes per row, so a pull request only runs them when it touches what
      # they exercise; pushes to main and manual runs always do. Measured
      # durations: see the PR that added this step.
      - name: Decide whether the scenarios run
        id: scenarios
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/(Scenarios|Pages|Expects|Tests/TestsSuite\.php|Tests/Suites/Scenarios|Support|Urls|Themes|Resolvers)|docker|docker-compose\.yml|composer\.lock|\.github/(workflows/live-smoke\.yml|scripts/|scenario-expected-skips\.json))'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change the scenarios exercise: skipped on this pull request."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Every scenario runs even when one is red. A failure, and a skip not
      # listed for this row in .github/scenario-expected-skips.json, fail the
      # step: on the demo data "no product can be added to the cart" or "no
      # offline payment method" means the discovery broke, not the shop.
      - name: Run the scenario suites
        if: ${{ !cancelled() && steps.scenarios.outputs.run == 'true' }}
        env:
          PRESTAFLOW_FO_URL: http://localhost:${{ matrix.port }}/
          PRESTAFLOW_BO_URL: http://localhost:${{ matrix.port }}/admin-dev/
          PRESTAFLOW_BO_EMAIL: admin@prestashop.com
          PRESTAFLOW_BO_PASSWD: prestashop
          # Created by EnsureTestAccount, the first scenario of the run.
          PRESTAFLOW_FO_EMAIL: pf-ci@example.com
          PRESTAFLOW_FO_PASSWD: 'PrestaFlow2026!'
          PRESTAFLOW_PS_VERSION: ${{ matrix.ps }}
          PRESTAFLOW_THEME: ${{ matrix.theme }}
          PRESTAFLOW_SHOP_ID: ${{ matrix.shop_id }}
          PRESTAFLOW_LOCALE: en
        run: .github/scripts/run-scenarios.sh "${{ matrix.ps }}-${{ matrix.theme }}"

      # Says what is on disk before the upload decides there is nothing to
      # take, so an empty artifact can be told apart from a capture that
      # never happened.
      - name: List what the run captured
        if: failure()
        run: |
          echo "cwd: $(pwd)"
          ls -laR smoke-output/ 2>&1 || echo "smoke-output/ does not exist"
          ls -laR scenario-output/ 2>&1 || echo "scenario-output/ does not exist"

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.ps }}-${{ matrix.theme }}
          path: |
            smoke-output/
            scenario-output/
          # `warn`, not `ignore`: an upload that finds nothing has to say so.
          if-no-files-found: warn
